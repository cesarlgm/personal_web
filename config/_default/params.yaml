# Hugo Blox settings. Schema: hugoblox.com/schema/v2. Docs: https://docs.hugoblox.com/
hugoblox:
  schema: "2.0"

  identity:
    name: "César Garro-Marín"
    organization: ""
    type: person
    tagline: ""
    description: "César Garro-Marín, labor economist. Assistant Professor and Beatriz Galindo grantee at Universitat Rovira i Virgili."
    social:
      twitter: ""

  theme:
    mode: system          # follows the visitor's light/dark setting
    pack: "cgm"           # data/themes/cgm.yaml: navy and red-orange from the previous site

  typography:
    pack: "academic"      # Lora headings, Source Serif body

  layout:
    radius: "md"
    spacing: "comfortable"
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    sticky: true
    align: left
    search: true
    theme_toggle: true
    theme_picker: false
    language_switcher: true
    cta:
      enable: false
      text: ""
      url: ""

  footer:
    style: minimal
    language_switcher: true
    text: ""

  copyright:
    notice: "© {year} {name}. This work is licensed under {license}"
    license:
      type: cc
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

  seo:
    title: ""
    ai:
      allow:
        - /
      disallow: []
      note: ""
      contact: ""

  content:
    math:
      enable: false
    toc:
      enable: false
    reading_time:
      enable: true
    citations:
      style: apa

  search:
    enable: true
    suggestions: []
    quick_actions: []

  comments:
    enable: false

  analytics:
    google:
      measurement_id: ""

  repository:
    enable: false

  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-us

  security:
    frame_options: allow

  privacy:
    enable: false

  debug:
    enable: false
